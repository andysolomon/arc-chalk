name: Merge Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Package boundaries
        run: bun run check:boundaries

      - name: Unit and component tests
        run: bun run test

      - name: Production build
        run: bun run build

  browser:
    name: Browser ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      # Let every shard finish, so one run shows all the failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Shards split by test count in project order, so a shard can span
      # projects on both engines. Each one needs both browsers.
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium webkit

      - name: Browser journeys
        run: bun run test:e2e --shard=${{ matrix.shard }}/4

  parity:
    name: Parity and PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Start canonical prototype
        run: |
          bun scripts/serve-prototype.ts > "$RUNNER_TEMP/chalk-prototype.log" 2>&1 &
          prototype_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:4174/Chalk%20Play%20Editor.dc.html" > /dev/null 2>&1; then
              echo "Canonical prototype ready (PID $prototype_pid)."
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/chalk-prototype.log"
          exit 1

      - name: Parity
        env:
          CHALK_PROTOTYPE_SERVER: external
        run: bun run test:parity

      - name: Installed shell
        run: bun run test:pwa

  # The one required status check in branch protection. GitHub counts a skipped
  # job as passing, so this must always run, and it fails unless every job above
  # succeeded. Together those jobs cover everything in `bun run check`.
  merge-gate:
    name: Merge Gate
    needs: [quality, browser, parity]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
