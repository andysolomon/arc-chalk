\* expect: NoEditLost violated
\* A finding on main: an edit committed after the Prepare click and before
\* Prepare shows the prepared plan is lost from the screen, or its write
\* lands after Prepare's and takes preparedRevisionId off the stored plan.
\* The revision itself is right. Main without EditsWaitForPrepare.
SPECIFICATION Spec

CONSTANTS
    Edits = {e1, e2}
    Prep = prep
    NoMark = NoMark
    NoRevision = NoRevision
    EditsBuildOn = "plan now"
    FieldCommits = "on leave or unmount"
    ApplyShows = "at once"
    PrepareReads = "plan now"
    ClicksSeeEveryPublish = TRUE
    FailedWriteIsLast = TRUE
    EditsWaitForPrepare = FALSE
    MaxFailures = 1
    MaxQueue = 3

INVARIANTS
    TypeOK
    NoEditLost
    PrepareFreezesLatest
