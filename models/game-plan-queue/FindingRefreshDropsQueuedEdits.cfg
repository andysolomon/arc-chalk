\* expect: NoEditLost violated
\* A finding on main: when IndexedDB refuses a write, refresh() shows the
\* library's list, which drops every edit still queued behind that write.
\* Main without FailedWriteIsLast.
SPECIFICATION Spec

CONSTANTS
    Edits = {e1, e2}
    Prep = prep
    NoMark = NoMark
    NoRevision = NoRevision
    EditsBuildOn = "plan now"
    FieldCommits = "on leave or unmount"
    ApplyShows = "at once"
    PrepareReads = "plan now"
    ClicksSeeEveryPublish = TRUE
    FailedWriteIsLast = FALSE
    EditsWaitForPrepare = TRUE
    MaxFailures = 1
    MaxQueue = 3

INVARIANTS
    TypeOK
    NoEditLost
