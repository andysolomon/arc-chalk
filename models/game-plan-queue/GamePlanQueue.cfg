    FailedWriteIsLast = TRUE
    EditsWaitForPrepare = TRUE
    MaxFailures = 1
    MaxQueue = 3

INVARIANTS
    TypeOK
    NoEditLost
    ShownIsStored
    PrepareFreezesLatest
