\* its design relies on. Each Finding*.cfg drops one of them.
SPECIFICATION Spec

CONSTANTS
    Edits = {e1, e2}
    Prep = prep
    NoMark = NoMark
    NoRevision = NoRevision
    EditsBuildOn = "plan now"
    FieldCommits = "on leave or unmount"
