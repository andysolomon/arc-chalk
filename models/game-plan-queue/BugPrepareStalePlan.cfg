\* expect: PrepareFreezesLatest violated
\* Replays the #75 review and its fix, b24b02c: apply showed a change only
\* once its write landed, and Prepare froze the plan the click passed in,
\* so a call number committed as the Prepare click left its field was not
\* in the revision. That hook had no refresh on a failed write.
SPECIFICATION Spec

CONSTANTS
    Edits = {e1, e2}
    Prep = prep
    NoMark = NoMark
    NoRevision = NoRevision
    EditsBuildOn = "render"
    FieldCommits = "on blur only"
    ApplyShows = "when written"
    PrepareReads = "caller's plan"
    ClicksSeeEveryPublish = TRUE
    FailedWriteIsLast = TRUE
    EditsWaitForPrepare = TRUE
    MaxFailures = 0
    MaxQueue = 3

INVARIANT PrepareFreezesLatest
