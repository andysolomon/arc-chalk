\* expect: SavedMeansStored violated
\* A finding on main: undo and redo take their save sequence when they run,
\* not when the Coach asks, so an edit asked for meanwhile loses its say
\* over the status. Main without EditsWaitForUndo.
SPECIFICATION Spec

CONSTANTS
    Edits = {e1, e2}
    Theirs = theirs
    NoRecord = NoRecord
    NoMark = NoMark
    TypedBuild = "in queue"
    BootHash = "when stored"
    GesturesWaitForSaves = TRUE
    RevealWaitsForSaves = TRUE
    EditsWaitForUndo = FALSE
    MaxFailures = 1
    MaxQueue = 2
    MaxUndoSteps = 2

INVARIANTS
    TypeOK
    NoEditLost
    CommitExpectsStoredHash
    SavedMeansStored
