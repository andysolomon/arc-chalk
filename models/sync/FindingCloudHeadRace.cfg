\* expect: NoEditLost violated
\* A finding on main: setPlayCloudHead reads the Play and puts it
\* back outside a transaction, so an edit committed between the two is
\* written over. It needs a second edit while the first is queued, so it
\* drops EditsWaitForSync too.
SPECIFICATION Spec

CONSTANTS
    p1 = p1
    p2 = p2
    a1 = a1
    a2 = a2
    b1 = b1
    b2 = b2
    r1 = r1
    r2 = r2
    NoDoc = NoDoc
    NoRev = NoRev
    NoPlay = NoPlay
    Rejected = {}
    OpenPlay = NoPlay
    EditsWaitForSync = FALSE
    OthersWaitForPush = TRUE
    EditsWaitForCloudHead = FALSE
    EditsWaitForApply = TRUE
    OthersWaitForResolve = TRUE
    MaxOtherEdits = 2
    MaxCrashes = 0
    MaxDrops = 0

INVARIANT NoEditLost
