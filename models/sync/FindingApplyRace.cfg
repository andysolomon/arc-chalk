\* expect: NoEditLost violated
\* A finding on main: applyChange reads the queue, fetches the revision and
\* writes it with applyRemotePlay. An edit committed in between, such as a
\* rename from the Playbooks page, is written over. Main without
\* EditsWaitForApply.
SPECIFICATION Spec

CONSTANTS
    p1 = p1
    p2 = p2
    a1 = a1
    a2 = a2
    b1 = b1
    b2 = b2
    r1 = r1
    r2 = r2
    NoDoc = NoDoc
    NoRev = NoRev
    NoPlay = NoPlay
    Rejected = {}
    OpenPlay = NoPlay
    EditsWaitForSync = TRUE
    OthersWaitForPush = TRUE
    EditsWaitForCloudHead = TRUE
    EditsWaitForApply = FALSE
    OthersWaitForResolve = TRUE
    MaxOtherEdits = 2
    MaxCrashes = 0
    MaxDrops = 0

INVARIANT NoEditLost
