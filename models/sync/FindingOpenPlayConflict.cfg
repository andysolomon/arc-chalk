    p1 = p1
    p2 = p2
    a1 = a1
    a2 = a2
    b1 = b1
    b2 = b2
    r1 = r1
    r2 = r2
    NoDoc = NoDoc
    NoRev = NoRev
    NoPlay = NoPlay
    Rejected = {}
    OpenPlay = p1
    EditsWaitForSync = TRUE
    OthersWaitForPush = TRUE
    EditsWaitForCloudHead = TRUE
    EditsWaitForApply = TRUE
    OthersWaitForResolve = TRUE
    MaxOtherEdits = 2
    MaxCrashes = 0
    MaxDrops = 0

INVARIANT InboxConflictsKnownToServer
