\* expect: NoConflictWithSelf violated
\* A finding on main: two edits to one Play before a sync both carry the
\* Play's cloudRevisionId as their base, so Convex finds the second in
\* conflict with the first. Main without EditsWaitForSync.
SPECIFICATION Spec

CONSTANTS
    p1 = p1
    p2 = p2
    a1 = a1
    a2 = a2
    b1 = b1
    b2 = b2
    r1 = r1
    r2 = r2
    NoDoc = NoDoc
    NoRev = NoRev
    NoPlay = NoPlay
    Rejected = {}
    OpenPlay = NoPlay
    EditsWaitForSync = FALSE
    OthersWaitForPush = TRUE
    EditsWaitForCloudHead = TRUE
    EditsWaitForApply = TRUE
    OthersWaitForResolve = TRUE
    MaxOtherEdits = 2
    MaxCrashes = 0
    MaxDrops = 0

INVARIANT NoConflictWithSelf
